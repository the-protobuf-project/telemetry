name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# One tag releases every SDK at one version:
#
#   git tag v1.3.0 && git push origin v1.3.0
#
#   Go      telemetry-go/v1.3.0 is tagged and pushed, which is what makes
#           `go get github.com/the-protobuf-project/telemetry/telemetry-go@v1.3.0`
#           resolve (a module in a subdirectory is versioned by tags prefixed
#           with its directory; a bare v1.3.0 tag versions nothing Go can see)
#   Rust    the .crate files attached to the GitHub release
#   Python  the wheel and sdist attached to the GitHub release
#   C++     the source archive attached to the GitHub release, and published
#           to the Bazel Central Registry as tpp_telemetry.cpp when a
#           BCR_PUBLISH_TOKEN secret is set (see .bcr/)
#
# Release with `just release 1.3.0`: it stamps the version into every
# manifest and commits it before tagging, which the BCR needs (the module's
# MODULE.bazel at the tag must name the version being published).
#
# Versions are stamped from the tag (`just set-version`), so the manifests
# can never disagree with the release.
jobs:
  version:
    name: Resolve version
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag must look like v1.2.3 or v1.2.3-rc.1, got '$tag'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release-go:
    name: Tag Go module
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: version
    permissions:
      contents: write
    env:
      GO_TAG: telemetry-go/v${{ needs.version.outputs.version }}
      GO_MODULE: github.com/${{ github.repository }}/telemetry-go
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: telemetry-go/go.mod

      - name: Test before tagging
        working-directory: telemetry-go
        run: go test -race ./...

      - name: Tag telemetry-go/vX.Y.Z on the released commit
        run: |
          if git rev-parse -q --verify "refs/tags/$GO_TAG" >/dev/null; then
            echo "$GO_TAG already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$GO_TAG" -m "telemetry-go ${{ needs.version.outputs.version }}" HEAD
            git push origin "$GO_TAG"
          fi

      - name: Publish to the Go module proxy
        # The proxy fetches a version the first time it is asked for it;
        # asking now makes it (and pkg.go.dev) list the release immediately.
        run: |
          for i in 1 2 3 4 5; do
            GOPROXY=https://proxy.golang.org GOFLAGS=-mod=mod \
              go list -m "$GO_MODULE@v${{ needs.version.outputs.version }}" && exit 0
            sleep 15
          done
          echo "::warning::proxy.golang.org has not picked up $GO_TAG yet; it will on first use"

  build-python:
    name: Build Python distribution
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: version
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up just
        uses: extractions/setup-just@v3

      - name: Stamp the release version
        run: just set-version "${{ needs.version.outputs.version }}"

      - name: Build sdist and wheel
        working-directory: ./telemetry-py
        run: |
          pip install build
          python -m build

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: telemetry-py/dist/*


  build-cpp:
    name: Build C++ artifact
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: version
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up just
        uses: extractions/setup-just@v3

      - name: Stamp the release version
        run: just set-version "${{ needs.version.outputs.version }}"

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build and test
        working-directory: ./telemetry-cpp
        run: bazel test //tests/...

      # The source, version stamped: what Bazel's archive_override and CMake's
      # FetchContent take. A prebuilt static library would hold one of the
      # SDK's libraries and none of opentelemetry-cpp, which it links against.
      - name: Package the source
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p telemetry-cpp/dist
          tar -czf "telemetry-cpp/dist/telemetry-cpp-$VERSION.tar.gz" \
            --exclude='telemetry-cpp/bazel-*' --exclude='telemetry-cpp/dist' \
            --exclude='.DS_Store' --exclude='telemetry-cpp/.env*' \
            --transform "s,^telemetry-cpp,telemetry-cpp-$VERSION," telemetry-cpp
          cd telemetry-cpp/dist && sha256sum "telemetry-cpp-$VERSION.tar.gz" > "telemetry-cpp-$VERSION.tar.gz.sha256"

      - name: Upload C++ artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpp-dist
          path: telemetry-cpp/dist/telemetry-cpp-*

  package-rust:
    name: Package Rust crate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: version
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up just
        uses: extractions/setup-just@v3

      - name: Stamp the release version
        run: just set-version "${{ needs.version.outputs.version }}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify crates package cleanly
        working-directory: ./telemetry-rs
        run: cargo package -p telemetry-derive -p telemetry-rs --no-verify --allow-dirty

      - name: Upload crate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-dist
          path: telemetry-rs/target/package/*.crate


  build-docker:
    name: Build & push observability image (GHCR)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          raw="${{ github.event.inputs.tag || github.ref_name }}"
          version="${raw#v}"
          image="ghcr.io/${{ github.repository }}"
          {
            echo "tags<<EOF"
            echo "${image}:${version}"
            echo "${image}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [version, release-go, build-python, build-cpp, package-rust]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Write install notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
          MODULE: github.com/${{ github.repository }}/telemetry-go
        run: |
          url="https://github.com/$REPO/releases/download/$TAG"
          sha="$(cut -d' ' -f1 "artifacts/cpp-dist/telemetry-cpp-$VERSION.tar.gz.sha256")"
          py="\`pip install $url/telemetry_py-$VERSION-py3-none-any.whl\`"
          rs="\`telemetry-rs = { git = \"https://github.com/$REPO\", tag = \"$TAG\" }\`"
          {
            echo "## Install $VERSION"
            echo
            echo "| Language | |"
            echo "| -------- | - |"
            echo "| Go       | \`go get $MODULE@v$VERSION\` |"
            echo "| Rust     | $rs |"
            echo "| Python   | $py |"
            echo "| C++      | \`telemetry-cpp-$VERSION.tar.gz\`, for Bazel or CMake (below) |"
            echo
            echo "### C++ with Bazel"
            echo
            echo '```starlark'
            echo "bazel_dep(name = \"tpp_telemetry.cpp\", version = \"$VERSION\")"
            echo "archive_override("
            echo "    module_name = \"tpp_telemetry.cpp\","
            echo "    urls = [\"$url/telemetry-cpp-$VERSION.tar.gz\"],"
            echo "    strip_prefix = \"telemetry-cpp-$VERSION\","
            echo "    integrity = \"sha256-$(echo "$sha" | xxd -r -p | base64)\","
            echo ")"
            echo '```'
            echo
            echo "### C++ with CMake"
            echo
            echo '```cmake'
            echo "FetchContent_Declare(telemetry"
            echo "    URL $url/telemetry-cpp-$VERSION.tar.gz"
            echo "    URL_HASH SHA256=$sha)"
            echo "FetchContent_MakeAvailable(telemetry)"
            echo '```'
          } > release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          body_path: release-notes.md
          files: |
            artifacts/python-dist/*
            artifacts/cpp-dist/*
            artifacts/rust-dist/*

  # The C++ module to the Bazel Central Registry: a pull request from a fork
  # of bazelbuild/bazel-central-registry, made with the BCR_PUBLISH_TOKEN
  # secret (a classic token with repo and workflow scopes). Skipped until
  # that secret is set.
  bcr-enabled:
    name: Check BCR publishing
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: release
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}
        run: |
          if [[ -n "$TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::BCR_PUBLISH_TOKEN is not set; not publishing to the BCR"
          fi

  publish-bcr:
    name: Publish C++ to the Bazel Central Registry
    needs: [version, bcr-enabled]
    if: ${{ needs.bcr-enabled.outputs.enabled == 'true' }}
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.7.0
    with:
      tag_name: ${{ needs.version.outputs.tag }}
      # The fork the pull request comes from; set the BCR_FORK variable to use another.
      registry_fork: ${{ vars.BCR_FORK || 'the-protobuf-project/bazel-central-registry' }}
      attest: false
      # Google's CLA check on BCR pull requests covers the committer as well as
      # the author, and the default committer (the Actions bot) cannot sign it.
      committer_name: oh-tarnished
      committer_email: 104291599+oh-tarnished@users.noreply.github.com
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
