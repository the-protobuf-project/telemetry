name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-python:
    name: Build Python distribution
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        working-directory: ./telemetry-py
        run: |
          pip install build
          python -m build

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: telemetry-py/dist/*

      # Opt-in: publishes to PyPI only when a PYPI_API_TOKEN secret is configured.
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ env.PYPI_API_TOKEN }}
          packages-dir: telemetry-py/dist

  build-cpp:
    name: Build C++ artifact
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build release library
        working-directory: ./telemetry-cpp
        run: bazel build -c opt //src:telemetry

      - name: Package headers and static library
        working-directory: ./telemetry-cpp
        run: |
          mkdir -p dist/telemetry-cpp
          cp -r include dist/telemetry-cpp/
          cp bazel-bin/src/libtelemetry.a dist/telemetry-cpp/
          tar -czf dist/telemetry-cpp.tar.gz -C dist telemetry-cpp

      - name: Upload C++ artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpp-dist
          path: telemetry-cpp/dist/telemetry-cpp.tar.gz

  package-rust:
    name: Package Rust crate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify crates package cleanly
        working-directory: ./telemetry-rs
        run: cargo package -p telemetry-derive -p telemetry --no-verify

      - name: Upload crate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-dist
          path: telemetry-rs/target/package/*.crate

      # Opt-in: publishes to crates.io only when a CARGO_REGISTRY_TOKEN secret is configured.
      # Order matters — the derive crate must be published before the crates that depend on it.
      - name: Publish to crates.io
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.CARGO_REGISTRY_TOKEN != '' }}
        working-directory: ./telemetry-rs
        run: |
          cargo publish -p telemetry-derive
          cargo publish -p telemetry

  build-docker:
    name: Build & push observability image (GHCR)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          raw="${{ github.event.inputs.tag || github.ref_name }}"
          version="${raw#v}"
          image="ghcr.io/${{ github.repository }}"
          {
            echo "tags<<EOF"
            echo "${image}:${version}"
            echo "${image}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [build-python, build-cpp, package-rust]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/python-dist/*
            artifacts/cpp-dist/*
            artifacts/rust-dist/*
