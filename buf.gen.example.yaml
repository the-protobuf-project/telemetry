version: v2

# Generates the example schema (examples/proto/jobs/v1/job.proto) that drives
# telemetry-go/examples/telemetry: plain message stubs plus the
# protoc-gen-telemetry companion file, both landing in the same Go package so
# the example's main.go can import one package and use both.
#
# Run:  buf generate --template buf.gen.example.yaml
# Out:  telemetry-go/examples/telemetry/gen/jobs/v1/jobsv1/{job.pb.go,job_telemetry.pb.go}
#
# protoc-gen-telemetry must be built first (bin/protoc-gen-telemetry — see
# telemetry-go/examples/telemetry/README or just `go build -o
# telemetry-go/bin/protoc-gen-telemetry ./telemetry-go/plugin/cmd/protoc-gen-telemetry`
# from the repo root).
# job.proto imports telemetry/v1/annotations.proto, so job.pb.go carries a
# cross-file Go import for it. That import now resolves directly: telemetry.v1's
# go_package was corrected to its real path under telemetry/telemetry-go, so the
# managed/override block that used to patch it here is no longer needed.

inputs:
  - directory: protobuf/examples/proto

plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: telemetry-go
    opt:
      - module=github.com/the-protobuf-project/telemetry/telemetry-go

  - local: telemetry-go/bin/protoc-gen-telemetry
    out: telemetry-go
    opt:
      - module=github.com/the-protobuf-project/telemetry/telemetry-go
