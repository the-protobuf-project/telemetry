server:
  http_listen_port: 3201

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:3200

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

metrics_generator:
  processor:
    local_blocks:
      # TraceQL metrics (`{...} | rate()`, Grafana's traces drilldown) are
      # served from these blocks; without the processor Tempo answers
      # "localblocks processor not found". Every span counts, not only
      # root and server spans.
      filter_server_spans: false
      flush_to_storage: true
    service_graphs:
      wait: 10s
    span_metrics:
      dimensions:
        - span.name
        - status.code
  registry:
    external_labels:
      source: tempo
  storage:
    path: /tmp/tempo/generator/wal
    remote_write:
      - url: http://localhost:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /data/tempo/generator/traces

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks

# Ingest limits, sized for ~1M spans/s (~300 MB/s). Tempo's default of
# 10,000 live traces refuses a burst of short independent traces
# (LIVE_TRACES_EXCEEDED); every root span is a new trace. Override with
# -e TEMPO_INGEST_BYTES=... etc.; supervisord starts Tempo with
# -config.expand-env=true.
overrides:
  ingestion_rate_limit_bytes: ${TEMPO_INGEST_BYTES:-500000000}
  ingestion_burst_size_bytes: ${TEMPO_INGEST_BURST_BYTES:-750000000}
  max_traces_per_user: ${TEMPO_MAX_LIVE_TRACES:-5000000}
  max_bytes_per_trace: 50000000
  metrics_generator_processors:
    - service-graphs
    - span-metrics
    - local-blocks
