server:
  http_listen_port: 3200
  grpc_listen_port: 3201
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# The metrics generator, here only for TraceQL metrics (`{...} | rate()`,
# Grafana's traces drilldown): its local-blocks processor serves them, and
# without it Tempo answers "localblocks processor not found".
metrics_generator:
  processor:
    local_blocks:
      filter_server_spans: false
      flush_to_storage: true
  storage:
    path: /var/tempo/generator/wal
  traces_storage:
    path: /var/tempo/generator/traces

overrides:
  metrics_generator_processors:
    - local-blocks
