[package]
name = "telemetry-examples"
version.workspace = true
edition.workspace = true
publish = false
description = "Runnable demos for Telemetry — OTLP to localhost:6009 (gRPC)"

[dependencies]
telemetry = { package = "telemetry-rs", path = "../telemetry" }
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
chrono.workspace = true
serde_json.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
# Upstream exporters alone, for the otel_baseline comparison.
opentelemetry-otlp.workspace = true
# The crosslang service: an HTTP server and client (both already in the tree).
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }

[[bin]]
name = "logging"
path = "src/bin/logging.rs"

[[bin]]
name = "logging_mcap"
path = "src/bin/logging_mcap.rs"

[[bin]]
name = "metrics"
path = "src/bin/metrics.rs"

[[bin]]
name = "tracing"
path = "src/bin/tracing.rs"

[[bin]]
name = "module_levels"
path = "src/bin/module_levels.rs"

[[bin]]
name = "crosslang"
path = "src/bin/crosslang.rs"

[[bin]]
name = "loadgen"
path = "src/bin/loadgen.rs"

[[bin]]
name = "otel_baseline"
path = "src/bin/otel_baseline.rs"
