[package]
# Published as telemetry-rs: "telemetry" on crates.io belongs to an unrelated
# project. The library keeps its name, so code still says `use telemetry::...`.
name = "telemetry-rs"
description = "One framework, every signal: logs, metrics, traces, baggage and profiles over OpenTelemetry, with MCAP recording"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
keywords = ["opentelemetry", "observability", "tracing", "metrics", "logging"]
categories = ["development-tools::debugging", "development-tools::profiling"]

[lib]
name = "telemetry"

[dependencies]
telemetry-derive.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
log4rs.workspace = true
mcap.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tonic = "0.14"
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry-prometheus.workspace = true
prometheus.workspace = true
tokio.workspace = true
chrono.workspace = true
colored.workspace = true
figment.workspace = true
pyroscope = { version = "2.1.5", default-features = false, features = ["rustls-tls", "backend-pprof-rs"], optional = true }

[dev-dependencies]
# The in-memory exporter, to check what metrics export.
opentelemetry_sdk = { workspace = true, features = ["testing"] }

[[example]]
name = "logging"
path = "examples/logging.rs"

[[example]]
name = "logging_mcap"
path = "examples/logging_mcap.rs"

[[example]]
name = "metrics"
path = "examples/metrics.rs"

[[example]]
name = "tracing"
path = "examples/tracing.rs"

[features]
default = ["profiling"]
# Continuous profiling to Pyroscope (TelemetryBuilder::with_profiling).
profiling = ["dep:pyroscope"]
